<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>FOUAD BARBER — Réseaux sociaux</title>
<style>
:root{--gold:#d6a52e;--gold2:#f2c75b;--bg:#050505;--card:#101010;--line:#76591a;--text:#fff;--muted:#b9b9b9}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#1b1b1b 0,#080808 38%,#030303 100%);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
.wrap{width:min(100% - 28px,520px);margin:auto;padding:28px 0 34px}
.logo{border:1px solid var(--line);border-radius:22px;padding:24px 18px;text-align:center;background:linear-gradient(145deg,#111,#050505);box-shadow:0 0 30px #000}
.scissors{font-size:34px;color:var(--gold2);margin-bottom:4px}.brand{font-size:40px;letter-spacing:7px;font-weight:900}.barber{color:var(--gold2);letter-spacing:8px;font-size:18px;font-weight:700;margin-top:4px}
.sub{margin:18px 0 20px;text-align:center;color:var(--muted);font-size:14px;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{min-height:104px;text-decoration:none;color:white;background:linear-gradient(145deg,#171717,#0b0b0b);border:1px solid #4d3b16;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;transition:.15s;box-shadow:inset 0 1px #242424}
.card:active{transform:scale(.97)} .icon{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:28px;font-weight:900;background:#000;border:1px solid #76591a}
.label{font-weight:700;font-size:14px;letter-spacing:.5px}.wide{grid-column:1/-1}
.contact{margin-top:18px;display:grid;gap:11px}.contact a{display:flex;align-items:center;justify-content:center;gap:12px;padding:15px;border-radius:15px;text-decoration:none;color:white;font-weight:800;border:1px solid #76591a;background:#0e0e0e}.wa{border-color:#268b47!important}.phone{font-size:18px}
.footer{text-align:center;color:#777;font-size:12px;margin-top:24px}
@media(max-width:360px){.brand{font-size:32px;letter-spacing:5px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style>
</head>
<body>
<main class="wrap">
<section class="logo">
  <div class="scissors">✂</div>
  <div class="brand">FOUAD</div>
  <div class="barber">BARBER</div>
</section>
<p class="sub">SCANNÉ PAR LE QR CODE • ACCÉDEZ À TOUS NOS RÉSEAUX</p>

<section class="grid" aria-label="Réseaux sociaux">

  <div class="icon">◎</div><div class="label">INSTAGRAM</div>
</a>
<a class="card" href="https://www.snapchat.com/add/fouadbarber2020?share_id=mqRWhaq8ky8&locale=fr-MA" target="_blank" rel="noopener">
  <div class="icon">👻</div><div class="label">SNAPCHAT</div>
</a>
<a class="card" href="https://www.tiktok.com/@fouad_barber?_r=1" target="_blank" rel="noopener">

<a class="card" href="https://maps.app.goo.gl/aJsRVLwM6SnSfkBG6" target="_blank" rel="noopener">

</main>
</body>
</html>
